<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Bulls Paradise - Join our Telegram community for market updates and educational content."
  >

  <title>Bulls Paradise</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      color: #ffffff;

      background:
        radial-gradient(
          circle at top,
          rgba(0, 255, 153, 0.12),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #020617,
          #0f172a 55%,
          #020617
        );
    }

    .card {
      width: 100%;
      max-width: 460px;

      padding: 45px 28px;

      text-align: center;

      background: rgba(15, 23, 42, 0.92);

      border: 1px solid rgba(255, 255, 255, 0.10);

      border-radius: 24px;

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.55);

      backdrop-filter: blur(12px);
    }

    h1 {
      font-size: 40px;

      line-height: 1.1;

      margin-bottom: 16px;

      letter-spacing: 1px;

      color: #00ff99;

      text-shadow:
        0 0 20px rgba(0, 255, 153, 0.20);
    }

    .tagline {
      color: #d1d5db;

      font-size: 17px;

      line-height: 1.6;

      margin-bottom: 30px;
    }

    .join-btn {
      display: block;

      width: 100%;

      padding: 18px 24px;

      border-radius: 50px;

      background: #0088cc;

      color: #ffffff;

      text-decoration: none;

      font-size: 20px;

      font-weight: 700;

      box-shadow:
        0 10px 30px rgba(0, 136, 204, 0.30);

      transition: all 0.25s ease;
    }

    .join-btn:hover {
      transform: translateY(-3px);

      background: #0099e6;

      box-shadow:
        0 15px 35px rgba(0, 136, 204, 0.40);
    }

    .join-btn:active {
      transform: translateY(0);
    }

    .features {
      margin-top: 28px;

      display: grid;

      gap: 10px;

      color: #cbd5e1;

      font-size: 14px;
    }

    .feature {
      padding: 12px;

      border-radius: 12px;

      background: rgba(255, 255, 255, 0.04);

      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .footer {
      margin-top: 28px;

      color: #64748b;

      font-size: 12px;
    }

    @media (max-width: 480px) {

      .card {
        padding: 38px 22px;
      }

      h1 {
        font-size: 32px;
      }

      .tagline {
        font-size: 16px;
      }

      .join-btn {
        font-size: 18px;

        padding: 16px 20px;
      }
    }
  </style>

</head>


<body>

  <main class="card">

    <h1>
      BULLS PARADISE
    </h1>

    <p class="tagline">
      Join our Telegram community for market updates,
      insights, educational content and daily updates.
    </p>


    <!-- Telegram Join Button -->
    <a
      class="join-btn"
      href="https://t.me/+m1wc6HSmNW1jY2Q1"
      target="_blank"
      rel="noopener noreferrer"
    >
      🚀 JOIN TELEGRAM NOW
    </a>


    <div class="features">

      <div class="feature">
        📊 Market Updates
      </div>

      <div class="feature">
        📈 Trading Education
      </div>

      <div class="feature">
        🔥 Daily Telegram Updates
      </div>

    </div>


    <div class="footer">
      © 2026 Bulls Paradise. All rights reserved.
    </div>

  </main>

</body>
</html>
