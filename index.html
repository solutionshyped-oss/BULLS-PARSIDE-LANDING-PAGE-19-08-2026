  <meta charset="UTF-8">

  <meta name="description" content="Bulls Paradise - Join our Telegram community for market updates and educational content.">
  <title>Bulls Paradise</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
      background:
        radial-gradient(circle at top, rgba(0, 255, 153, 0.12), transparent 35%),
        linear-gradient(135deg, #020617, #0f172a 55%, #020617);
    }

    .card {
      width: 100%;
      max-width: 460px;
      padding: 42px 28px;
      text-align: center;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 24px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
    }

    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 22px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #00ff99;
      box-shadow: 0 0 30px rgba(0, 255, 153, 0.25);
    }

    h1 {
      font-size: 38px;
      line-height: 1.1;
      margin-bottom: 14px;
      letter-spacing: 0.5px;
      color: #00ff99;
    }

    .tagline {
      color: #d1d5db;
      font-size: 17px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .join-btn {
      display: block;
      width: 100%;
      padding: 17px 24px;
      border-radius: 50px;
      background: #0088cc;
      color: #fff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0, 136, 204, 0.30);
      transition: 0.25s ease;
    }

    .join-btn:hover {
      transform: translateY(-3px);
      background: #0099e6;
      box-shadow: 0 15px 35px rgba(0, 136, 204, 0.40);
    }

    .features {
      margin-top: 28px;
      display: grid;
      gap: 10px;
      color: #cbd5e1;
      font-size: 14px;
    }

    .feature {
      padding: 11px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
    }

    .footer {
      margin-top: 26px;
      color: #64748b;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 35px 22px;
      }

      h1 {
        font-size: 32px;
      }

      .logo {
        width: 105px;
        height: 105px;
      }
    }
  </style>
